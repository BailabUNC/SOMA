[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-traill"
version = "0.2.0"
description = "SOMA optical myography acquisition and second-revision experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["torch>=2.6,<2.7", "numpy>=2,<3", "scikit-learn>=1.4,<2"]

[project.optional-dependencies]
acquisition = ["pyserial>=3.5", "matplotlib>=3.9", "scipy>=1.15", "cmap>=0.6"]
preparation = ["pandas>=2.2", "scipy>=1.15", "matplotlib>=3.9", "tqdm", "cmap>=0.6"]
legacy = ["matplotlib>=3.9", "pandas>=2.2", "scipy>=1.15", "tqdm", "prettytable", "tensorboard"]
cad = ["pyautogui", "pynput"]

[project.scripts]
soma = "soma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soma = ["configs/*.json"]
traill_daq = ["*.json"]
